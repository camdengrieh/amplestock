[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"  # tests deploy the PoolManager from hookmate artifacts, never from v4-core source (which pins 0.8.26)
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
ffi = false
fs_permissions = [
  { access = "read-write", path = "./gas" },
  # `script/04_MineHook.s.sol` records the mined hook address, its salt and the init-code hash it is bound to in
  # `script/config/hook.json`, which `test/unit/HookAddress.t.sol` re-checks in CI. Writing is therefore part of
  # the script's job; every other consumer of this directory only reads.
  { access = "read-write", path = "./script/config" },
]
gas_reports = ["AmpsHook", "AmpsVault", "AmpsBonds", "AmpsStaking", "Amps"]
fuzz = { runs = 512, max_test_rejects = 200_000 }
invariant = { runs = 64, depth = 64, fail_on_revert = false }

[profile.ci]
fuzz = { runs = 4_096, max_test_rejects = 1_000_000 }
invariant = { runs = 256, depth = 128 }
verbosity = 2

[profile.lite]
optimizer = false
fuzz = { runs = 64 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

# `AmpsVault` implements the whole of `IAmpsVault` and does not fit EIP-170 under the project-wide
# `optimizer_runs = 1_000_000` legacy pipeline (45,818 B as one contract, 26,509 B at `runs = 1` even after the
# read side moved into `VaultNavLib`). Compiling `src/vault/**` alone through the IR pipeline at 200 runs brings it
# to ~23 kB with margin, and leaves every other contract's codegen — and every gas baseline — untouched.
[[profile.default.additional_compiler_profiles]]
name = "vault"
optimizer_runs = 200
via_ir = true

[[profile.default.compilation_restrictions]]
paths = "src/vault/*"
optimizer_runs = 200
via_ir = true

# `AmpsBonds` carries the whole bond call graph plus the collateral registry and twelve governed setters; at the
# project-wide 1,000,000 optimizer runs solc inlines it past EIP-170. Compiled on its own at 200 runs through the
# IR pipeline it fits with room to spare, and nothing else in `src/` changes.
[[profile.default.compilation_restrictions]]
paths = "src/bonds/*"
optimizer_runs = 200
via_ir = true

# `AmpsHook` implements the whole of `IAmpsHook` and `IMarketReference` on top of the two swap callbacks, the
# three packed words, the observation ring and the bounded external probes; at the project-wide 1,000,000
# optimizer runs solc inlines it to 28,014 B, well past EIP-170. Compiled on its own through the IR pipeline at
# 200 runs it is 20,757 B, which leaves 3,819 B of EIP-170 headroom -- exactly the treatment `src/vault/*` and
# `src/bonds/*` get, and it reuses their compiler profile. Higher runs buy nothing worth having: 1,000 runs is
# 22,448 B and 5,000 runs 23,955 B, and all three are within ~300 gas per swap of each other, because the hook's
# cost is dominated by cold storage and the `IFeePolicy` staticcall rather than by codegen.
[[profile.default.compilation_restrictions]]
paths = "src/hook/*"
optimizer_runs = 200
via_ir = true
