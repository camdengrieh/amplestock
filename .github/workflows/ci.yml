# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A superseded run must be cancelled *before* any job in it reaches the roll-up, or the roll-up records a
# cancellation that is indistinguishable from a job the runner killed on its own timeout. One group per ref,
# cancel-in-progress, and the roll-up below then treats `cancelled` as the failure it is.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: default

jobs:
  # -------------------------------------------------------------------------------------------
  # Foundry: build, format, the isolated correctness suite, gas regression
  #
  # On 1f6dd11 this job was CANCELLED by `timeout-minutes: 45` with forge still running, and the
  # roll-up recorded that as a notice — so the PR looked green without the job having finished.
  # Three changes: the budget is 90 minutes, `forge coverage` moved to its own best-effort job,
  # and the Phase 3 invariant campaigns moved to a job with their own 60-minute budget (they are
  # excluded from the isolated run below so the work is not done twice).
  # -------------------------------------------------------------------------------------------
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1  # pinned: gas baselines and transient-storage semantics are toolchain-specific

      - name: Show toolchain
        run: forge --version

      - name: Build
        run: forge build --sizes

      # contracts/foundry.lock pins the four submodules to the same commits the gitlinks carry, so
      # `actions/checkout` with `submodules: recursive` already produces a tree the lock agrees
      # with and forge never has to reach the network to satisfy it. If the two ever disagree,
      # forge rewrites the lock during the build and this fails — which is the drift we want to
      # see, rather than a silent fetch.
      - name: Lockfile is in sync with the submodules
        run: git diff --exit-code -- foundry.lock

      # Step 1 of the I14 enumeration proof (docs/phase2-state-model.md §7). GuardSymmetry.t.sol
      # holds one classification entry per external state-changing selector of AmpsVault and
      # AmpsBonds and asserts the counts, but `ffi` is off and `fs_permissions` does not cover the
      # artifact directories, so Solidity cannot compare that list against the compiled ABI. This
      # does, and fails on any mutating selector nobody classified. It runs straight after the
      # build because it reads contracts/out, which the build has just written.
      - name: Selector gate (I14 enumeration)
        working-directory: .
        run: python3 scripts/selector-gate.py --out contracts/out --json selector-report.json

      - name: Upload selector report
        if: always() && hashFiles('selector-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: selector-report
          path: selector-report.json
          if-no-files-found: ignore

      - name: Format check
        run: forge fmt --check

      # `--isolate` runs every call in its own EVM context, which is what makes the correctness
      # suite trustworthy but makes gas measurements meaningless (cold-storage and warm-access
      # accounting differ from a real transaction). The gas suite is therefore excluded here and
      # run non-isolated in its own step below. The Phase 3 invariant campaigns are excluded too:
      # at the ci profile they are 256 runs x 128 depth over the whole placement path and on their
      # own account for most of a 45-minute budget, so they get their own job rather than eating
      # this one's. Both exclusions are re-run elsewhere; nothing is dropped.
      #
      # ONE `--no-match-path`, with a brace glob. Passing the flag twice does not accumulate in
      # Foundry 1.8.1 — it selects **zero** tests, and `forge test` then exits 0 having run nothing,
      # which is the same silent green this whole change exists to stop. Measured on this tree:
      # 72 suites total, 71 with the gas exclusion, 70 with both.
      - name: Test (isolate, ci profile)
        env:
          FOUNDRY_PROFILE: ci
        run: forge test --isolate --no-match-path 'test/{gas/*,invariant/Phase3*}' -vvv

      # ...and prove the filter did not silently select nothing.
      - name: The isolated run actually selected the suite
        env:
          FOUNDRY_PROFILE: ci
        run: |
          suites=$(forge test --isolate --no-match-path 'test/{gas/*,invariant/Phase3*}' --list | grep -c '\.t\.sol')
          echo "isolated run covers $suites suites"
          test "$suites" -ge 60

      # Gas regression gate. Deliberately NOT `--isolate`: isolation changes storage warm/cold
      # accounting, so isolated numbers cannot be compared against a baseline measured from a
      # normal transaction. The suite reads contracts/gas/baseline.json and fails if any
      # measurement exceeds baseline x 1.2; if the baseline file is missing it logs SKIP rather
      # than failing, so this step is safe on a branch that has not recorded one yet.
      - name: Gas regression (non-isolated)
        run: |
          if [ -f gas/baseline.json ]; then
            echo "::group::gas baseline"
            cat gas/baseline.json
            echo "::endgroup::"
          else
            echo "::warning::contracts/gas/baseline.json is absent — the gas suite will log SKIP."
          fi
          forge test --match-path 'test/gas/*' -vv

      - name: Gas report (informational)
        continue-on-error: true
        run: forge test --match-path 'test/gas/*' --gas-report

  # -------------------------------------------------------------------------------------------
  # Phase 3 invariant campaigns
  #
  # Split out of `contracts` because at the ci profile (256 runs x 128 depth) they walk the whole
  # placement path and are the single longest thing in the suite. Their own 60-minute budget means
  # a slow campaign fails on its own merits instead of cancelling the correctness suite with it.
  # -------------------------------------------------------------------------------------------
  invariants:
    name: invariants (Phase 3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1  # pinned: gas baselines and transient-storage semantics are toolchain-specific

      - name: Phase 3 invariants (isolate, ci profile)
        env:
          FOUNDRY_PROFILE: ci
        run: forge test --isolate --match-path 'test/invariant/Phase3*' -vvv

  # -------------------------------------------------------------------------------------------
  # Coverage
  #
  # Best effort, and therefore its own job rather than a step that eats the correctness suite's
  # budget: `forge coverage` recompiles without the optimizer and can OOM or hit stack-too-deep on
  # the via-ir contracts long before the tests do. A coverage hiccup must never gate a correct
  # build, which is why this job is absent from the roll-up's required set.
  # -------------------------------------------------------------------------------------------
  coverage:
    name: coverage (best effort)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1  # pinned: gas baselines and transient-storage semantics are toolchain-specific

      - name: Coverage (lcov)
        id: coverage
        continue-on-error: true
        run: forge coverage --no-match-path 'test/gas/*' --report lcov --report summary

      - name: Upload coverage artifact
        if: steps.coverage.outcome == 'success' && hashFiles('contracts/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: contracts-lcov
          path: contracts/lcov.info
          if-no-files-found: ignore

  # -------------------------------------------------------------------------------------------
  # Licence gate: no BUSL/AGPL/GPL reachable from contracts/src/**, no missing SPDX headers
  # -------------------------------------------------------------------------------------------
  licence-gate:
    name: licence gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1  # pinned: gas baselines and transient-storage semantics are toolchain-specific

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The gate needs solc standard-JSON build-info, which a plain `forge build` does not write.
      # It builds one itself into a private out/cache pair so it never collides with the
      # `contracts` job's artifacts.
      - name: Licence gate
        run: python3 scripts/licence-gate.py --out out-licence --cache cache-licence --json licence-report.json

      - name: Upload licence report
        if: always() && hashFiles('licence-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: licence-report
          path: licence-report.json
          if-no-files-found: ignore

  # -------------------------------------------------------------------------------------------
  # Node workspace: typecheck, build, test the TS packages
  # -------------------------------------------------------------------------------------------
  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile` is the rule; the fallback exists only for the first push, before
      # pnpm-lock.yaml is committed. Once the lockfile lands, the fallback stops being reachable.
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing — installing unpinned. Commit the lockfile."
            pnpm install --no-frozen-lockfile
          fi

      - name: Typecheck (packages)
        run: pnpm turbo run typecheck --filter='./packages/*' --filter='./apps/*'

      - name: Build (packages)
        run: pnpm turbo run build --filter='./packages/*' --filter='./apps/*'

      - name: Test (packages)
        run: pnpm turbo run test --filter='./packages/*' --filter='./apps/*'

      # launch.json is a generated mirror of packages/config/src/index.ts. If someone edits one
      # and not the other the config test already fails; this makes the drift obvious in the diff.
      - name: Config JSON mirror is up to date
        run: |
          pnpm --filter @amplestocks/config gen:json
          git diff --exit-code -- packages/config/launch.json

  # -------------------------------------------------------------------------------------------
  # Hook address re-check
  # -------------------------------------------------------------------------------------------
  hook-address:
    name: hook address re-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Does a mined hook address exist yet?
        id: probe
        run: |
          if [ -f contracts/script/config/hook.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Found contracts/script/config/hook.json"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "contracts/script/config/hook.json not present — nothing to re-check."
          fi

      - name: Install Foundry
        if: steps.probe.outputs.present == 'true'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1  # pinned: gas baselines and transient-storage semantics are toolchain-specific

      # The hook's address encodes its permission flags (0x38C0), so the salt in script/config/hook.json
      # is valid for exactly one creation-code hash. Any change to AmpsHook, to anything it
      # imports, to the compiler or optimizer settings, or to its constructor arguments
      # invalidates it, and a stale salt would deploy a hook the PoolManager rejects. The suite
      # re-mines from the real `type(AmpsHook).creationCode`, re-derives the address from the
      # committed salt and init-code hash, and fails if either moved. The fix is always the same:
      # re-run `forge script script/04_MineHook.s.sol` and commit script/config/hook.json.
      - name: Re-check the mined hook address
        if: steps.probe.outputs.present == 'true'
        working-directory: contracts
        run: |
          echo "::group::committed hook address"
          cat script/config/hook.json
          echo "::endgroup::"
          forge test --isolate --match-path 'test/unit/HookAddress*.t.sol' -vv

  # -------------------------------------------------------------------------------------------
  # Broadcast test: the whole deploy pipeline against a local anvil, with --broadcast, twice
  # -------------------------------------------------------------------------------------------
  #
  # ADDITIVE. This job is new and changes nothing about the `contracts` job above; it is separate
  # on purpose. It brings up an anvil and sends several hundred real transactions through
  # `forge script --broadcast`, which is the only way to catch the Foundry 1.8.1 nonce bug
  # documented in docs/deploy-runbook.md §0.1: a broadcast window opened inside a helper contract
  # writes every transaction with the same nonce, and simulation — which is all `forge test` does
  # — cannot see it. It needs no network beyond localhost and takes about three minutes.
  broadcast-test:
    name: broadcast test (anvil)
    runs-on: ubuntu-latest
    # 370 s of pipeline measured on a 4-core runner, plus the build. `forge script` recompiles once per
    # `--libraries` configuration and each one re-runs the via-IR compile of src/vault, src/bonds and src/hook,
    # so a cold cache costs about twenty minutes more. 40 is that with room, and still far short of a hang.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1  # pinned: the nonce behaviour this job exists to pin down is toolchain-specific

      # Runs 00_Preflight, 02_Libraries (both passes), 10_TestnetPools (assets), 03_Core,
      # 10_TestnetPools (register), 09_Phase3Wire, 11_GenesisPlacement (both phases) and 12_Verify
      # against anvil on chain 46630, through a real TimelockController at zero delay; asserts the
      # resulting chain state with `cast` (32 pools, 30 constituents, 30 bond markets, every pointer,
      # a GREEN gate, S0 = 5,000 AMPS with 250 vesting, NAV/share $1.00, 328 live cells); then runs
      # the entire pipeline again and asserts a chain fingerprint did not move; then finalises the
      # timelock and asserts the hand-over.
      - name: Deploy pipeline against anvil
        env:
          FOUNDRY_BIN: /home/runner/.foundry/bin
        run: bash test/script/broadcast.sh

      # The scripts rewrite committed artefacts under script/config by design and the harness puts
      # them back. If it did not, that is a bug in the harness and the diff is the evidence.
      - name: Working tree is clean
        run: git diff --exit-code -- script/config

  # -------------------------------------------------------------------------------------------
  # Single required check
  # -------------------------------------------------------------------------------------------
  #
  # `cancelled` is a FAILURE here, not a notice. On 1f6dd11 the contracts job was killed by its own
  # `timeout-minutes` with forge still running, the roll-up logged a notice, and the head looked
  # green without the suite having finished. A superseded run cannot reach this step any more:
  # the workflow-level concurrency group cancels the whole run, roll-up included, before it starts.
  # So the only way a required job reaches here as `cancelled` is that something killed it, and
  # that has to be red.
  #
  # `coverage` is deliberately absent from `needs`: it is best effort by design (see its job).
  ci:
    name: ci
    if: always()
    needs: [contracts, invariants, licence-gate, node, hook-address, broadcast-test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo "contracts=${{ needs.contracts.result }}"
          echo "invariants=${{ needs.invariants.result }}"
          echo "licence-gate=${{ needs.licence-gate.result }}"
          echo "node=${{ needs.node.result }}"
          echo "hook-address=${{ needs.hook-address.result }}"
          echo "broadcast-test=${{ needs.broadcast-test.result }}"
          failed=0
          for r in "${{ needs.contracts.result }}" "${{ needs.invariants.result }}" \
                   "${{ needs.licence-gate.result }}" "${{ needs.node.result }}" \
                   "${{ needs.hook-address.result }}" "${{ needs.broadcast-test.result }}"; do
            case "$r" in
              success|skipped) ;;
              cancelled) echo "::error::a required job was CANCELLED — it did not finish, so this head is not green"; failed=1 ;;
              *) echo "::error::a required job did not succeed ($r)"; failed=1 ;;
            esac
          done
          exit "$failed"
