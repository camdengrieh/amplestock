# SPDX-License-Identifier: MIT
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: amps-keeper
    static_configs:
      - targets: ["keeper:9464"]
  - job_name: relayer
    static_configs:
      - targets: ["relayer:8080"]
    metrics_path: /metrics
